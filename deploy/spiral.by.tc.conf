# HTTP Server Block for spiral.by.tc Redirecting to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name spiral.by.tc;

    # Allow ACME challenge for certbot
    location ^~ /.well-known/acme-challenge/ {
        root /home/tc/prime-tree/dist;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block for spiral.by.tc
server {
    include /etc/nginx/snippets/common-settings.conf;
    include /etc/nginx/snippets/ssl-params.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name spiral.by.tc;

    ssl_certificate /etc/letsencrypt/live/spiral.by.tc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiral.by.tc/privkey.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; manifest-src 'self'";

    root /home/tc/prime-tree/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    access_log /var/log/nginx/spiral.by.tc.access.log;
    error_log /var/log/nginx/spiral.by.tc.error.log;
}
